<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คิววิดีโอ AI - Boss's Car (Live Monitor)</title>
    <!-- Google Fonts: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'kanit': ['Kanit', 'sans-serif'] },
                    colors: {
                        tiktok: '#00f2ea',
                        tiktok_red: '#ff0050',
                        success: '#10b981',
                        warning: '#f59e0b',
                        premium_gold: '#D4AF37'
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                        'ai-wave': 'aiWave 1.5s ease-in-out infinite',
                        'scan': 'scanLine 3s linear infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 10px rgba(0, 242, 234, 0.2)' },
                            '50%': { boxShadow: '0 0 25px rgba(0, 242, 234, 0.6)' },
                        },
                        aiWave: {
                            '0%, 100%': { opacity: '0.4', transform: 'scaleY(1)' },
                            '50%': { opacity: '1', transform: 'scaleY(1.5)' },
                        },
                        scanLine: {
                            '0%': { top: '-10%' },
                            '100%': { top: '110%' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: radial-gradient(circle at top, #1e293b 0%, #000000 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .featured-card {
            background: linear-gradient(145deg, rgba(0, 242, 234, 0.15) 0%, rgba(255, 0, 80, 0.05) 100%);
            border: 1px solid rgba(0, 242, 234, 0.3);
        }
        .status-doing { background: rgba(0, 242, 232, 0.2); color: #00f2ea; border: 1px solid #00f2ea; }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
        .status-done { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
        
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f2ea, transparent);
            z-index: 5;
            box-shadow: 0 0 15px #00f2ea;
        }

        .loading-shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        /* Bottom Nav Fix */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }
    </style>
</head>
<body class="text-white p-4 pb-32">

    <div class="max-w-md mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-4">
            <a href="index.html" class="w-10 h-10 glass-card rounded-full flex items-center justify-center hover:bg-white/10 transition-colors">
                <i class="fa-solid fa-arrow-left text-xs text-gray-400"></i>
            </a>
            <div class="text-center">
                <h1 class="text-xl font-black italic uppercase tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">AI Video Queue</h1>
                <p id="sync-status" class="text-[9px] text-tiktok uppercase tracking-widest font-bold flex items-center justify-center gap-2">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tiktok opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-tiktok"></span>
                    </span>
                    Live Tracking
                </p>
            </div>
            <div class="w-10 h-10 flex items-center justify-center text-tiktok_red animate-pulse">
                <i class="fa-brands fa-tiktok text-xl"></i>
            </div>
        </div>

        <!-- Warning if no URL -->
        <div id="url-warning" class="hidden bg-red-900/50 border border-red-500 rounded-xl p-4 text-center">
            <p class="text-xs font-bold text-red-200">⚠️ ยังไม่เชื่อมต่อข้อมูล</p>
            <p class="text-[10px] text-red-300 mt-1">กรุณาแก้โค้ดบรรทัด APPS_SCRIPT_URL ให้เป็นลิงก์ Web App ใหม่ของคุณ</p>
        </div>

        <!-- Summary Stats -->
        <div class="grid grid-cols-3 gap-3">
            <div class="glass-card rounded-2xl p-3 text-center border-b border-white/10">
                <p class="text-[9px] text-gray-500 uppercase font-bold">Requests</p>
                <p class="text-xl font-black" id="total-count">-</p>
            </div>
            <div class="glass-card rounded-2xl p-3 text-center border-b-2 border-tiktok">
                <p class="text-[9px] text-tiktok uppercase font-bold">Processing</p>
                <p class="text-xl font-black" id="doing-count">-</p>
            </div>
            <div class="glass-card rounded-2xl p-3 text-center border-b-2 border-success">
                <p class="text-[9px] text-success uppercase font-bold">Uploaded</p>
                <p class="text-xl font-black" id="done-count">-</p>
            </div>
        </div>

        <!-- Dynamic List Container -->
        <div class="space-y-6" id="queue-container">
            <div id="featured-section" class="space-y-4"></div>
            
            <div class="space-y-3" id="normal-list-section">
                <div class="flex items-center justify-between px-2">
                    <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest flex items-center gap-2">
                        <i class="fa-solid fa-hourglass-half"></i> คิวรอดำเนินการ
                    </h3>
                    <span id="queue-time-badge" class="text-[9px] text-tiktok font-bold italic opacity-60 uppercase">Real-time Data</span>
                </div>
                <div id="queue-list" class="space-y-3">
                    <!-- Loading Skeletons -->
                    <div class="glass-card rounded-2xl p-4 h-20 loading-shimmer"></div>
                    <div class="glass-card rounded-2xl p-4 h-20 loading-shimmer"></div>
                    <div class="glass-card rounded-2xl p-4 h-20 loading-shimmer"></div>
                </div>
            </div>

            <!-- Completed List (Separated) -->
            <div class="space-y-3 hidden" id="completed-list-section">
                <div class="flex items-center justify-between px-2 mt-8 border-t border-white/10 pt-4">
                    <h3 class="text-[10px] font-bold text-success uppercase tracking-widest flex items-center gap-2">
                        <i class="fa-solid fa-check-circle"></i> ผลงานที่เสร็จแล้ว
                    </h3>
                    <span class="text-[9px] text-gray-500 font-bold italic opacity-60 uppercase">History</span>
                </div>
                <div id="completed-list" class="space-y-3"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="pt-10 pb-6 text-center space-y-4 border-t border-white/5 opacity-50 hover:opacity-100 transition-opacity">
            <p class="text-[9px] text-gray-700 italic">ViralVision AI Queue Monitor System</p>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav flex items-center justify-around px-6">
        <a href="#" onclick="fetchQueues(true); return false;" class="flex flex-col items-center gap-1 text-tiktok hover:opacity-80 transition-opacity">
            <i class="fa-solid fa-rotate text-xl"></i>
            <span class="text-[9px] font-bold uppercase tracking-widest">Refresh</span>
        </a>
        <a href="index.html" class="w-12 h-12 bg-white rounded-full flex items-center justify-center -translate-y-6 shadow-xl shadow-tiktok/20 border-4 border-[#0f172a] hover:scale-110 transition-transform">
            <i class="fa-solid fa-house text-black text-lg"></i>
        </a>
        <a href="https://monsterseason32-lgtm.github.io/donate/" target="_blank" class="flex flex-col items-center gap-1 text-gray-500 hover:text-premium_gold transition-colors">
            <i class="fa-solid fa-heart text-xl"></i>
            <span class="text-[9px] font-bold uppercase tracking-widest">Donate</span>
        </a>
    </nav>

    <script>
        // =================================================================
        // ⚠️ สำคัญ: ใส่ URL ของ Web App ใหม่ของคุณที่นี่ ⚠️
        // ต้องเป็นลิงก์ที่ลงท้ายด้วย /exec และได้จากการ Deploy ในหน้า Apps Script
        // =================================================================
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxc3MC4Ok1mYUyr2d8zvJHPBm3t2vutvLjBowFeawjRtYtnFOslklbHx7PZSHhxyZ0hKw/exec'; 
        // =================================================================

        const REFRESH_INTERVAL = 30000; // 30 วินาที
        let lastDataHash = "";

        async function fetchQueues(isManual = false) {
            const statusText = document.getElementById('sync-status');
            const warningBox = document.getElementById('url-warning');

            if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('YOUR_NEW_MERGED_SCRIPT_URL_HERE')) {
                warningBox.classList.remove('hidden');
                statusText.innerText = "❌ Config Error";
                return;
            }

            if(isManual) statusText.innerText = "🔄 Syncing...";

            try {
                // UPDATE: เพิ่ม parameter ?action=getQueue เพื่อรองรับ Backend ใหม่
                const fetchUrl = `${APPS_SCRIPT_URL}?action=getQueue&_t=${Date.now()}`;
                
                const response = await fetch(fetchUrl);
                const jsonResponse = await response.json();
                
                // UPDATE: ข้อมูลตอนนี้ถูกห่ออยู่ใน object { status: 'success', data: [...] }
                // เราต้องดึง data ออกมา
                let data = [];
                if (jsonResponse.data && Array.isArray(jsonResponse.data)) {
                    data = jsonResponse.data;
                } else if (Array.isArray(jsonResponse)) {
                    data = jsonResponse; // Fallback for old version
                }

                console.log("Fetched Data:", data);

                const currentHash = JSON.stringify(data);
                if (currentHash !== lastDataHash || isManual) {
                    renderDashboard(data);
                    lastDataHash = currentHash;
                }
                statusText.innerHTML = `
                    <span class="relative flex h-2 w-2 mr-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tiktok opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-tiktok"></span>
                    </span> Live Tracking`;
            } catch (error) {
                console.error(error);
                statusText.innerText = "⚠️ Link Error";
            }
        }

        // ฟังก์ชันจัดกลุ่มข้อมูล (เหมือนเดิม)
        function groupDataByModel(data) {
            const groups = [];
            data.forEach(item => {
                const modelName = (item.carModel || item.Model || "Unknown").trim();
                const customer = (item.customerName || item.Customer || "Guest").trim();
                const tiktokUser = (item.tiktokUsername || item.TikTok || "").trim();
                
                const existing = groups.find(g => g.carModel === modelName && g.customerName === customer);
                
                if (existing) {
                    existing.episodes.push(item);
                } else {
                    groups.push({
                        carModel: modelName,
                        customerName: customer,
                        tiktokUsername: tiktokUser,
                        episodes: [item]
                    });
                }
            });
            return groups;
        }

        function renderDashboard(rawData) {
            // Stats Calculation
            const statusKey = (item) => (item.status || item.Status || "").toLowerCase();
            
            document.getElementById('total-count').innerText = rawData.length;
            const doingListRaw = rawData.filter(i => statusKey(i).includes('doing') || statusKey(i).includes('กำลังทำ') || statusKey(i).includes('ทำ'));
            const doneCount = rawData.filter(i => statusKey(i).includes('done') || statusKey(i).includes('เสร็จ')).length;
            
            document.getElementById('doing-count').innerText = doingListRaw.length;
            document.getElementById('done-count').innerText = doneCount;

            const featuredSection = document.getElementById('featured-section');
            const normalList = document.getElementById('queue-list');
            const completedList = document.getElementById('completed-list');
            const completedSection = document.getElementById('completed-list-section');
            
            featuredSection.innerHTML = '';
            normalList.innerHTML = '';
            completedList.innerHTML = '';

            const groupedData = groupDataByModel(rawData);
            
            // หาคันที่กำลังทำล่าสุด (คันแรกในรายการ Doing)
            const currentDoing = doingListRaw.length > 0 ? doingListRaw[0] : null;

            // 1. Featured Section (กำลังทำ)
            if (currentDoing) {
                const tiktokLink = currentDoing.tiktokUsername ? `https://www.tiktok.com/@${currentDoing.tiktokUsername.replace('@', '')}` : '#';
                const tiktokBtn = currentDoing.tiktokUsername ? `
                    <a href="${tiktokLink}" target="_blank" class="ml-2 inline-flex items-center justify-center w-6 h-6 rounded-full bg-tiktok/20 hover:bg-tiktok hover:text-black transition-all text-tiktok border border-tiktok/30">
                        <i class="fa-brands fa-tiktok text-[10px]"></i>
                    </a>
                ` : '';

                featuredSection.innerHTML = `
                    <div class="featured-card rounded-[2.5rem] p-6 relative overflow-hidden animate-pulse-glow">
                        <div class="scan-line animate-scan"></div>
                        <div class="absolute -right-6 -bottom-6 opacity-10">
                            <i class="fa-solid fa-microchip text-[10rem]"></i>
                        </div>
                        <div class="relative z-10 space-y-4">
                            <div class="flex justify-between items-center">
                                <span class="bg-tiktok_red text-white text-[9px] font-black px-3 py-1 rounded-full uppercase italic flex items-center gap-2">
                                    <span class="w-1.5 h-1.5 bg-white rounded-full animate-ping"></span>
                                    AI Generating...
                                </span>
                                <span class="text-[9px] text-white/50 font-mono">#${currentDoing.id || '...'}</span>
                            </div>
                            <div>
                                <h2 class="text-3xl font-black italic uppercase leading-tight text-white tracking-tighter drop-shadow-lg">
                                    ${currentDoing.carModel || 'Request Car'}
                                </h2>
                                <div class="text-tiktok text-xs font-bold mt-1 flex items-center gap-1">
                                    <i class="fa-solid fa-user"></i>
                                    <span>${currentDoing.customerName || 'Follower'}</span>
                                    ${tiktokBtn}
                                </div>
                            </div>
                            <div class="bg-black/60 rounded-2xl p-4 border border-white/10 backdrop-blur-sm">
                                <p class="text-xs leading-relaxed text-gray-200 font-medium italic">
                                    "${currentDoing.details || 'กำลังวิเคราะห์และสร้างวิดีโอจำลอง...'}"
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Loop through groups for Normal List
            let queueCounter = 0;

            groupedData.forEach((group) => {
                const groupStatusStr = group.episodes.map(e => statusKey(e)).join(' ');
                const isGroupDoing = groupStatusStr.includes('doing') || groupStatusStr.includes('กำลังทำ');
                
                // ถ้ากลุ่มนี้คือกำลังทำ และเป็นคันเดียวกับ Featured ให้ข้าม (ไม่แสดงซ้ำ)
                if (isGroupDoing && currentDoing && group.carModel === currentDoing.carModel && group.customerName === currentDoing.customerName) {
                    return; 
                }

                const isGroupFullyDone = group.episodes.every(e => {
                    const s = statusKey(e);
                    return s.includes('done') || s.includes('เสร็จ');
                });

                const tiktokLink = group.tiktokUsername ? `https://www.tiktok.com/@${group.tiktokUsername.replace('@', '')}` : '#';
                const tiktokBtn = group.tiktokUsername ? `
                    <a href="${tiktokLink}" target="_blank" class="shrink-0 w-5 h-5 rounded-full bg-white/10 hover:bg-tiktok hover:text-black flex items-center justify-center transition-all text-gray-400">
                        <i class="fa-brands fa-tiktok text-[9px]"></i>
                    </a>
                ` : '';

                // Generate Episode Links/Badges
                let episodesHTML = "";
                group.episodes.forEach((ep, epIdx) => {
                    const s = statusKey(ep);
                    const isDone = s.includes('done') || s.includes('เสร็จ');
                    const isDoing = s.includes('doing') || s.includes('กำลังทำ');
                    
                    // ปรับการแสดงผล Label
                    let label = "EP." + (epIdx + 1);
                    if (group.episodes.length === 1) label = "VIEW";

                    if (isDone) {
                        episodesHTML += `
                            <a href="${ep.videoLink || '#'}" target="_blank" class="text-[8px] px-2 py-1 rounded-md font-bold uppercase status-done flex items-center gap-1 shadow-sm hover:scale-105 transition-transform border border-success/30 bg-success/10 text-success">
                                ${label} <i class="fa-solid fa-play text-[6px]"></i>
                            </a>`;
                    } else if (isDoing) {
                         episodesHTML += `
                            <span class="text-[8px] px-2 py-1 rounded-md font-bold uppercase status-doing border border-tiktok/30 bg-tiktok/10 text-tiktok animate-pulse">
                                COOKING...
                            </span>`;
                    } else {
                        episodesHTML += `
                            <span class="text-[8px] px-2 py-1 rounded-md font-bold uppercase border border-gray-700 text-gray-500 opacity-50">
                                WAITING
                            </span>`;
                    }
                });

                const cardHTML = `
                    <div class="glass-card rounded-2xl p-4 flex items-center gap-4 hover:bg-white/10 transition-all group border-l-4 ${isGroupFullyDone ? 'border-l-success' : 'border-l-transparent hover:border-l-tiktok'}">
                        <div class="w-10 h-10 rounded-xl bg-white/5 flex flex-col items-center justify-center border border-white/10 shrink-0">
                            ${isGroupFullyDone ? 
                                `<i class="fa-solid fa-check text-success text-lg"></i>` : 
                                `<span class="text-[7px] font-bold text-gray-500 uppercase tracking-tighter">Queue</span>
                                 <span class="text-sm font-black italic group-hover:text-tiktok">${(++queueCounter).toString().padStart(2, '0')}</span>`
                            }
                        </div>
                        <div class="flex-1 overflow-hidden min-w-0">
                            <h4 class="font-bold text-sm text-gray-200 truncate group-hover:text-white uppercase tracking-tight">${group.carModel || 'Unknown Car'}</h4>
                            <div class="flex items-center gap-2 mt-0.5">
                                <p class="text-[10px] text-gray-500 font-bold truncate">By ${group.customerName || 'Guest'}</p>
                                ${tiktokBtn}
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 items-end shrink-0 pl-2">
                            ${episodesHTML}
                        </div>
                    </div>
                `;

                if (isGroupFullyDone) {
                    completedList.innerHTML += cardHTML;
                } else {
                    normalList.innerHTML += cardHTML;
                }
            });

            // Toggle visibility based on content
            if (normalList.innerHTML === '') {
                document.getElementById('normal-list-section').classList.add('hidden');
            } else {
                document.getElementById('normal-list-section').classList.remove('hidden');
            }

            if (completedList.innerHTML === '') {
                completedSection.classList.add('hidden');
            } else {
                completedSection.classList.remove('hidden');
            }
        }

        window.onload = () => {
            fetchQueues();
            setInterval(() => fetchQueues(), REFRESH_INTERVAL);
        };
    </script>
</body>
</html>
